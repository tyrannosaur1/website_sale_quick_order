name: tests

on:
  push:
    branches: ["*.0"]
  workflow_dispatch:

jobs:
  plan:
    # The branches are independent copies, one per Odoo series: a push tests
    # the series it was pushed to. Asking for a run by hand sweeps them all.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        run: |
          set -eu
          all="10.0 11.0 12.0 13.0 14.0 15.0 16.0 17.0 18.0 19.0 20.0"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="$all"
          else
            case " $all " in
              *" ${{ github.ref_name }} "*)
                list="${{ github.ref_name }}" ;;
              *)
                echo "::error::${{ github.ref_name }} is not one of the series branches"
                exit 1 ;;
            esac
          fi
          out='{"include":['
          sep=''
          n=0
          for s in $list; do
            case "$s" in
              10.0) pg=9.6;  addons=/usr/lib/python2.7/dist-packages/odoo/addons ;;
              11.0|12.0) pg=10;  addons=/usr/lib/python3/dist-packages/odoo/addons ;;
              13.0|14.0) pg=12;  addons=/usr/lib/python3/dist-packages/odoo/addons ;;
              15.0|16.0) pg=13;  addons=/usr/lib/python3/dist-packages/odoo/addons ;;
              17.0|18.0) pg=15;  addons=/usr/lib/python3/dist-packages/odoo/addons ;;
              *)         pg=16;  addons=/usr/lib/python3/dist-packages/odoo/addons ;;
            esac
            case "$s" in
              1[0-2].0) recipe=demo ;;
              1[3-8].0) recipe=scoped ;;
              *)        recipe=subcommand ;;
            esac
            out="$out$sep{\"odoo\":\"$s\",\"pg\":\"$pg\",\"addons\":\"$addons\",\"recipe\":\"$recipe\"}"
            sep=','
            n=$((n + 1))
          done
          out="$out]}"
          echo "value=$out" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout the branch that matches the image
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.odoo }}

      - name: Name the module
        run: |
          # The repository root holds the module directory, not the manifest:
          # the module is called bs_*, the repository website_sale_*.
          MODULE=$(ls -d "$GITHUB_WORKSPACE"/bs_* | head -1 | xargs -n1 basename)
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: |
          docker network create ci || true
          docker run -d --name db --network ci \
            -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo -e POSTGRES_DB=postgres \
            postgres:${{ matrix.pg }}
          for i in $(seq 1 30); do
            docker exec db pg_isready -U odoo -d postgres >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Install the module with demo data (10.0-12.0)
        if: matrix.recipe == 'demo'
        run: |
          set -o pipefail
          docker run --rm --network ci \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons" \
            --entrypoint /usr/bin/odoo "odoo:${{ matrix.odoo }}" \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/mnt/extra-addons,${{ matrix.addons }} \
            --stop-after-init \
            -d "test_$MODULE" -i "$MODULE" 2>&1 | tee odoo.log

      - name: Run the tests on the installed module (10.0-12.0)
        if: matrix.recipe == 'demo'
        run: |
          set -o pipefail
          docker run --rm --network ci \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons" \
            --entrypoint /usr/bin/odoo "odoo:${{ matrix.odoo }}" \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/mnt/extra-addons,${{ matrix.addons }} \
            --stop-after-init \
            -d "test_$MODULE" -u "$MODULE" --test-enable 2>&1 | tee -a odoo.log

      - name: Install the module and run its tests (13.0-18.0)
        if: matrix.recipe == 'scoped'
        run: |
          set -o pipefail
          docker run --rm --network ci \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons" \
            --entrypoint /usr/bin/odoo "odoo:${{ matrix.odoo }}" \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/mnt/extra-addons,${{ matrix.addons }} \
            --without-demo=all --stop-after-init \
            -d "test_$MODULE" -i "$MODULE" --test-enable \
            --test-tags "/$MODULE" 2>&1 | tee odoo.log

      - name: Install the module and run its tests (19.0-20.0)
        if: matrix.recipe == 'subcommand'
        run: |
          set -o pipefail
          docker run --rm --network ci \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons" \
            --entrypoint /usr/bin/odoo "odoo:${{ matrix.odoo }}" server \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/mnt/extra-addons,${{ matrix.addons }} \
            --without-demo=all --stop-after-init \
            -d "test_$MODULE" -i "$MODULE" --test-enable \
            --test-tags "/$MODULE" 2>&1 | tee odoo.log

      - name: Fail when a test failed
        # Odoo exits 0 even when tests fail, so the log is the only witness.
        # A run that collected nothing is a failure too: a job that installs a
        # module and runs no test looks exactly like a passing one.
        run: |
          grep -E "tests when loading|Ran [0-9]+ tests|failed, " odoo.log || true
          if ! grep -qE "Ran [0-9]+ tests|tests when loading" odoo.log; then
            echo "no test was collected -- the module name or the test tags are wrong"
            exit 1
          fi
          if grep -qE "FAIL:|FAILED|[1-9][0-9]* failed," odoo.log; then
            echo "at least one test failed"
            exit 1
          fi
